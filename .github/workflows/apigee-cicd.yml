name: Apigee Edge CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PROXY_NAME: SML_Training_Abhishek
  TARGET_ENV: dev

jobs:
  lint:
    name: Lint API Proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apigeelint
        run: npm install -g apigeelint
      - name: Run apigeelint
        run: apigeelint -s apiproxy -f table.js

  deploy-dev:
    name: Deploy to Dev
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Apigee access token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST https://login.apigee.com/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json;charset=utf-8" \
            -H "Authorization: Basic ZWRnZWNsaTplZGdlY2xpc2VjcmV0" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.APIGEE_REFRESH_TOKEN }}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to get access token. Refresh token may have expired."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install apigeetool
        run: npm install -g apigeetool

      - name: Deploy proxy to Apigee Edge (dev)
        run: |
          apigeetool deployproxy \
            -o "${{ secrets.APIGEE_ORG }}" \
            -e "$TARGET_ENV" \
            -n "$PROXY_NAME" \
            -d . \
            -t "${{ steps.auth.outputs.token }}"

      - name: Smoke test
        run: |
          sleep 20
          URL="https://${{ secrets.APIGEE_ORG }}-${TARGET_ENV}.apigee.net${{ vars.BASE_PATH }}"
          echo "Testing $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $STATUS"
          [ "$STATUS" -lt 400 ]
