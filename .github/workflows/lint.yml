name: PR Lint Check

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint API Proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apigeelint
        run: npm install -g apigeelint
      - name: Run apigeelint
        run: apigeelint -s apiproxy -f table.js
